<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ψηφιακό Μενού | by Digitech</title>
    <style>
        :root {
            --primary: #c2956e;
            --bg-color: #1a1a1a;
            --text-light: #f5f5f5;
            --card-bg: #2a2a2a;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding: 0;
        }
        header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, #111 0%, var(--bg-color) 100%);
        }
        h1 {
            color: var(--primary);
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        p.subtitle {
            color: #aaa;
            font-style: italic;
        }
        .menu-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .category {
            font-size: 1.5em;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-top: 40px;
            margin-bottom: 20px;
        }
        .menu-item {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .menu-item:hover {
            transform: translateY(-3px);
            border-left: 4px solid var(--primary);
        }
        .item-details h3 {
            margin: 0 0 5px 0;
            font-size: 1.2em;
        }
        .item-details p {
            margin: 0;
            color: #aaa;
            font-size: 0.9em;
        }
        .item-price {
            font-size: 1.3em;
            font-weight: bold;
            color: var(--primary);
        }
        footer {
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            font-size: 0.9em;
            color: #777;
            border-top: 1px solid #333;
        }
        .digitech-brand {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>The Coffee Hub</h1>
        <p class="subtitle">Premium Quality Coffee</p>
    </header>

    <div class="menu-container">
        <div class="category">Καφέδες</div>
        
        <div class="menu-item">
            <div class="item-details">
                <h3>Freddo Espresso</h3>
                <p>Διπλή δόση 100% Arabica</p>
            </div>
            <div class="item-price">2.50€</div>
        </div>

        <div class="menu-item">
            <div class="item-details">
                <h3>Cappuccino</h3>
                <p>Με πλούσιο αφρόγαλα</p>
            </div>
            <div class="item-price">3.00€</div>
        </div>

        <div class="category">Σνακς</div>

        <div class="menu-item">
            <div class="item-details">
                <h3>Club Sandwich</h3>
                <p>Κοτόπουλο, μπέικον, τυρί, ντομάτα & πατάτες</p>
            </div>
            <div class="item-price">6.50€</div>
        </div>
    </div>

    <footer>
        Powered by <a href="#" class="digitech-brand">DIGITECH</a>
    </footer>

</body>
</html>
