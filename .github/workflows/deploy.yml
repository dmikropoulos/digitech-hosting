name: Build and Push Demo Site

# Πότε θα τρέχει αυτός ο αυτοματισμός;
on:
  push:
    branches:
      - main
    paths:
      - 'sites/demo-menu/**'
      - 'k8s-cluster/**'
      - '.github/workflows/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Δίνουμε τα απαραίτητα δικαιώματα για να ανεβάσει το image
    permissions:
      contents: read
      packages: write

    steps:
      - name: Κατέβασμα του κώδικα
        uses: actions/checkout@v4

      - name: Σύνδεση στο GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Χτίσιμο (Build) και Ανέβασμα (Push) του Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./sites/demo-menu
          push: true
          # ΕΔΩ βάζεις το username σου με μικρά γράμματα
          tags: ghcr.io/dmikropoulos/digitech-hosting/sites/demo-menu:latest
          
      - name: Setup Kubernetes context
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy to Oracle Cloud (K3s)
        run: |
          kubectl apply -f k8s-cluster/demo-menu.yaml
          kubectl rollout restart deployment demo-menu